background {
    monitor =
    path = screenshot
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 2
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 260, 54
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(bb00ccee)
    inner_color = rgba(00000088)
    font_color = rgba(ffffffff)
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = 64
    font_family = Inter
    position = 0, 60
    halign = center
    valign = center
}
